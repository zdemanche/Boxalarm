# Required before the first preview (validated all at once by components/shared/stack-config.ts;
# full runbook: docs/runbooks/first-deploy.md). Never commit a secret value here.
#   pulumi config set nerisSchemaSourceUrl https://<schema-pipeline-host>/neris/schema.json --stack prod
#   pulumi config set notificationSesFromAddress notifications@<ses-verified-domain> --stack prod
#   pulumi config set --secret smsWebhookSecret "$(openssl rand -hex 32)" --stack prod
#   pulumi config set --secret voiceWebhookSecret "$(openssl rand -hex 32)" --stack prod
#   pulumi config set --secret pushWebhookSecret "$(openssl rand -hex 32)" --stack prod
#   pulumi config set alertingPageEmail oncall@<dept-domain> --stack prod   # required in prod
#   pulumi config set chiefNotificationEmail chief@<dept-domain> --stack prod   # required in prod
#   pulumi config set smsProviderEndpointUrl https://<sms vendor API host>/<path> --stack prod   # required in prod
#   pulumi config set voiceProviderEndpointUrl https://<voice vendor API host>/<path> --stack prod   # required in prod
# Once the department's CAD inbound mail domain has its MX record (docs/runbooks/first-deploy.md, CAD ingress):
#   pulumi config set cadIngressEmailDomain cad.<dept-domain> --stack prod
# Only once canaryEnabled is true:
#   pulumi config set --secret canaryMemberId <canary member id> --stack prod
# webOrigin below is a placeholder: preview fails on a .example/.invalid/.test/localhost host
# outside dev until it is the real web origin:
#   pulumi config set webOrigin https://<real web host> --stack prod
config:
  aws:region: us-east-1
  boxalarm-infra:env: prod
  boxalarm-infra:webOrigin: https://app.boxalarm.example
  boxalarm-infra:deptId: nichols-fd
