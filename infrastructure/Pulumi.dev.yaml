# Required before the first preview (validated all at once by components/shared/stack-config.ts;
# full runbook: docs/runbooks/first-deploy.md). Never commit a secret value here.
#   pulumi config set notificationSesFromAddress notifications@<ses-verified-domain> --stack dev
#   pulumi config set --secret smsWebhookSecret "$(openssl rand -hex 32)" --stack dev
#   pulumi config set --secret voiceWebhookSecret "$(openssl rand -hex 32)" --stack dev
#   pulumi config set --secret pushWebhookSecret "$(openssl rand -hex 32)" --stack dev
#   pulumi config set alertingPageEmail oncall@<dept-domain> --stack dev   # prod-required; warned elsewhere
#   pulumi config set chiefNotificationEmail chief@<dept-domain> --stack dev   # prod-required; warned elsewhere
# Only once canaryEnabled is true:
#   pulumi config set --secret canaryMemberId <canary member id> --stack dev
config:
  aws:region: us-east-1
  boxalarm-infra:env: dev
  boxalarm-infra:webOrigin: https://localhost:5173
  boxalarm-infra:deptId: nichols-fd
  # Placeholder until the NERIS schema pipeline publishes a URL (E6-S11-INFRA #246). Safe:
  # the daily refresh fails and notifies chief-notifications; nothing else reads it.
  boxalarm-infra:nerisSchemaSourceUrl: https://neris-schema-source.invalid/neris/schema.json
