name: ui

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      # Dependency audit for the runtime dependency tree (PR #321 review s2). Blocks on
      # critical advisories; lower severities are printed in the log for triage.
      # Gate is `critical`, not `high`, because main already carries a known high advisory
      # (image-size, transitive); tighten to `high` once that is resolved.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=critical
      - run: npm run lint
      - run: npm run format
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Forbid focused tests
        run: "! grep -rnE '\\b(it|test|describe)\\.only\\(' apps packages --include='*.ts' --include='*.tsx' --include='*.js' --exclude-dir=node_modules"
      - run: npm run test:e2e -- --forbid-only

  pages-build:
    needs: ui-verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build --workspace apps/web
        env:
          VITE_DEMO: "true"
          VITE_BASE: /${{ github.event.repository.name }}/
      - run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/apps/web/dist

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
